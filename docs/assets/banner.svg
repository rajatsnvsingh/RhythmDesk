<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="430" viewBox="0 0 1440 430" role="img" aria-labelledby="title description">
<title id="title">Rhythm Desk</title>
<desc id="description">A personal music archive. Warm charcoal, ivory catalogue typography and the record monogram. Import, curate, approve and publish.</desc>
<rect width="1440" height="430" fill="#181a17"/>
<path d="M56 126H1384M56 363H1384M944 40V390" fill="none" stroke="#41463d"/>
<g transform="translate(56 46) scale(.85)">
  <rect width="64" height="64" rx="14" fill="#7bdfb5"/>
  <g fill="#112c22"><rect x="17" y="14" width="8" height="36"/><circle cx="33" cy="28" r="14"/><path d="M30 36 39 34 51 50H40Z"/></g>
  <circle cx="33" cy="28" r="6" fill="#7bdfb5"/><circle cx="33" cy="28" r="2" fill="#112c22"/>
</g>
<text x="136" y="79" font-family="Consolas,monospace" font-size="15" letter-spacing="3" fill="#b4b5a7">A PERSONAL MUSIC ARCHIVE</text>
<text x="53" y="241" font-family="Georgia,serif" font-size="86" letter-spacing="-3" fill="#eee9dd">Rhythm Desk</text>
<text x="58" y="293" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#b4b5a7">From the messy drawer to a library you trust.</text>
<text x="58" y="397" font-family="Consolas,monospace" font-size="14" letter-spacing="1" fill="#aac5a6">IMPORT  →  CURATE  →  APPROVE  →  PUBLISH</text>
<text x="1002" y="79" font-family="Consolas,monospace" font-size="14" letter-spacing="2" fill="#b4b5a7">THE COLLECTION</text>
<text x="1000" y="188" font-family="Georgia,serif" font-size="38" fill="#eee9dd">Collected with care.</text>
<g font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#b4b5a7">
  <text x="1002" y="236">Every release inspected.</text>
  <text x="1002" y="270">Every label intentional.</text>
  <text x="1002" y="304">Your approval. Always.</text>
</g>
<text x="1002" y="397" font-family="Consolas,monospace" font-size="12" letter-spacing="1" fill="#b4b5a7">SELF-HOSTED / ORIGINALS RETAINED</text>
</svg>
