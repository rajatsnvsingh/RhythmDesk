name: rhythm-curator
x-runtime: &runtime
  build: .
  image: ${CURATOR_IMAGE:-nexus/rhythm-curator:local}
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]
  group_add: ["10000"]
  environment: &environment
    CURATOR_ROOT: /srv/media/music
    CURATOR_STATE_ROOT: /var/lib/rhythm-desk
    BEETS_CONFIG: /etc/rhythm-curator/config.yaml
    PYTHONUNBUFFERED: "1"
services:
  worker:
    <<: *runtime
    user: "${WORKER_UID:-10001}:10000"
    command: [python, app/worker.py]
    networks: [curator]
    environment:
      <<: *environment
      STABLE_SECONDS: "${STABLE_SECONDS:-180}"
    volumes:
      - ${STAGING_PATH:-./data/staging}:/srv/media/music/staging
      - type: volume
        source: state
        target: /var/lib/rhythm-desk
        volume: {nocopy: true}
      - type: volume
        source: state
        target: /var/lib/rhythm-desk/approvals
        read_only: true
        volume: {nocopy: true, subpath: approvals}
    # Deliberately no library or publisher-socket mount.
  web:
    <<: *runtime
    user: "${UI_UID:-10002}:10000"
    command: [python, app/server.py, --bind, 0.0.0.0]
    networks: [curator]
    ports: ["127.0.0.1:${UI_PORT:-8765}:8765"]
    environment:
      <<: *environment
      CURATOR_AUTH_REQUIRED: ${CURATOR_AUTH_REQUIRED:-1}
      CURATOR_UI_TOKEN: ${CURATOR_UI_TOKEN:-}
      CURATOR_ALLOWED_HOSTS: ${CURATOR_ALLOWED_HOSTS:-127.0.0.1,localhost}
      CURATOR_SECURE_COOKIE: ${CURATOR_SECURE_COOKIE:-0}
      CURATOR_PUBLISH_SOCKET: /run/rhythm-publisher/publish.sock
      CURATOR_HOST_STAGING: ${STAGING_PATH:-./data/staging}
      CURATOR_HOST_STATE: "Docker volume: ${STATE_VOLUME:-rhythm-desk-state}"
      CURATOR_STATE_VOLUME: ${STATE_VOLUME:-rhythm-desk-state}
      CURATOR_HOST_LIBRARY: ${LIBRARY_PATH:?Set LIBRARY_PATH}
      CURATOR_HOST_ATTIC: ${ATTIC_PATH:?Set ATTIC_PATH}
      CURATOR_HOST_PUBLISH: ${ATTIC_PATH}/publish-staging
      CURATOR_SOURCE_ROOT: /mnt/music-source
      CURATOR_HOST_SOURCE: ${SOURCE_PATH:-/srv/media/music}
      STABLE_SECONDS: "${STABLE_SECONDS:-180}"
    volumes:
      - ${STAGING_PATH:-./data/staging}:/srv/media/music/staging
      - type: volume
        source: state
        target: /var/lib/rhythm-desk
        volume: {nocopy: true}
      - ${LIBRARY_PATH:?Set LIBRARY_PATH to the existing Rhythm Attic}:/srv/media/music/rhythm-attic:ro
      - ${SOURCE_PATH:-/srv/media/music}:/mnt/music-source:ro
      - publisher-socket:/run/rhythm-publisher:ro
      - type: volume
        source: state
        target: /var/lib/rhythm-desk/approvals
        read_only: true
        volume: {nocopy: true, subpath: approvals}
    depends_on: [worker, publisher]
  publisher:
    <<: *runtime
    user: "${PUBLISHER_UID:-10003}:10000"
    command: [python, app/publisher.py]
    network_mode: none
    environment:
      <<: *environment
      CURATOR_UI_UID: ${UI_UID:-10002}
      CURATOR_LIBRARY_ROOT: /srv/media/music/rhythm-attic/library
      CURATOR_PUBLISH_ROOT: /srv/media/music/rhythm-attic/publish-staging
      CURATOR_PUBLISH_SOCKET: /run/rhythm-publisher/publish.sock
    volumes:
      - ${STAGING_PATH:-./data/staging}/Curated:/srv/media/music/staging/Curated:ro
      - type: volume
        source: state
        target: /var/lib/rhythm-desk/approvals
        volume: {nocopy: true, subpath: approvals}
      - type: volume
        source: state
        target: /var/lib/rhythm-desk/taxonomy
        read_only: true
        volume: {nocopy: true, subpath: taxonomy}
      # One mount permits atomic rename between publish-staging and library.
      # The host parent is traverse-only for publisher; staging is overlaid RO.
      - ${ATTIC_PATH:?Set ATTIC_PATH}:/srv/media/music/rhythm-attic
      - ${STAGING_PATH}:/srv/media/music/rhythm-attic/staging:ro
      - publisher-socket:/run/rhythm-publisher
volumes:
  state:
    name: ${STATE_VOLUME:-rhythm-desk-state}
    external: true
  publisher-socket:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=${PUBLISHER_UID:-10003},gid=10000,mode=0770
networks:
  curator:
    driver: bridge
